# Construit la version macOS (.dmg + .zip) sur un Mac de GitHub.
# - Push sur la branche "mac" : build de test, le .dmg est téléchargeable dans les "Artifacts" du run.
# - Lancement manuel (onglet Actions → "Build macOS" → Run workflow) : le .dmg est téléchargeable dans les "Artifacts" du run.
# - Push d'un tag vX.Y.Z : les fichiers sont en plus ajoutés à la release GitHub du même nom (à côté du .exe).
name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [mac]
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pas de compte Apple Developer : signature "ad hoc" (identity "-" dans package.json), sans notarisation.
      - run: npm run mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Tmoney-mac
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/latest-mac.yml

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*.blockmap
            dist/latest-mac.yml
