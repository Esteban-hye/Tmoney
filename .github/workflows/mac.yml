# Construit Tmoney pour macOS (.dmg + .zip) et Windows (installateur .exe) sur les machines de GitHub.
# - Push sur la branche "mac" ou lancement manuel : build de test, fichiers téléchargeables dans les "Artifacts" du run.
# - Push d'un tag vX.Y.Z : la release GitHub est créée seulement quand les DEUX versions sont prêtes
#   (sinon l'app Windows verrait une release sans latest.yml et afficherait une erreur de mise à jour).
name: Build

on:
  workflow_dispatch:
  push:
    branches: [mac]
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pas de compte Apple Developer : signature "ad hoc" (identity "-" dans package.json), sans notarisation.
      - run: npm run mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Tmoney-mac
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*-mac.zip.blockmap
            dist/latest-mac.yml

  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Tmoney-win
          path: |
            dist/Tmoney-Setup-*.exe
            dist/Tmoney-Setup-*.exe.blockmap
            dist/latest.yml

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
